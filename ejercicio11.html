<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Kilómetros a Millas</title>
    <link rel="stylesheet" href="css/ejercicio11.css">


    <script src="js/ejercicio11.js"></script>
</head>

<body>
    <div style="margin: 20px; text-align: left;">
        <a href="index.html"
            style="text-decoration: none; color: #007BFF; font-weight: bold; font-family: Arial, sans-serif;">Regresar
            al índice</a>
    </div>

    <div class="contenedor-principal">
        <h1>Conversor de Distancia</h1>
        <p>Convierte kilómetros a millas fácilmente.</p>

        <div class="grupo-input">
            <label for="kilometros" class="etiqueta">Distancia en Kilómetros (km):</label>
            <input type="number" id="kilometros" class="campo-texto" placeholder="Ej: 10">
        </div>

        <button type="button" id="btnConvertir">Convertir</button>

        <div class="grupo-input">
            <label for="millas" class="etiqueta">Distancia en Millas (mi):</label>
            <input type="text" id="millas" class="campo-texto campo-lectura" placeholder="Resultado" readonly>
        </div>
    </div>
</body>

</html>
