<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Edad para Votar</title>
    <link rel="stylesheet" href="css/ejercicio13.css">


    <script src="js/ejercicio13.js"></script>
</head>

<body>
    <div style="margin: 20px; text-align: left;">
        <a href="index.html"
            style="text-decoration: none; color: #007BFF; font-weight: bold; font-family: Arial, sans-serif;">Regresar
            al índice</a>
    </div>
    
    <div class="contenedor-principal">
        <h1>Verificador</h1>
        <p>Verifica tu edad para votar</p>

        <div class="grupo-input">
            <label for="edad" class="etiqueta">Edad que tienes:</label>
            <input type="number" id="edad" class="campo-texto" placeholder="Ej: 25">
        </div>
        
        <button type="button" id="btnVerificar">Verificar</button>
        
        <div class="grupo-input">
            <label for="resultado" class="etiqueta">Resultado:</label>
            <input type="text" id="resultado" class="campo-texto campo-lectura" placeholder="Resultado" readonly>
        </div>
    </div>
</body>

</html>
