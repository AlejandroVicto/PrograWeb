    <h1>Receta: Tacos al Pastor Caseros</h1>
    <h2>Ingredientes:</h2>
    <ul>
        <li>Carne de cerdo (500g)</li>
        <li>Piña (1 taza)
            <ul>
                <li>Cortada en cubos</li>
            </ul>
        </li>
        <li>Tortillas de maiz</li>
    </ul>
    <h2>Preparacion:</h2>
    <ol>
        <li>Marinar la carne por 2 horas.</li>
        <li>Asar a fuego medio.</li>
    </ol>
    <p>¡Sirve con cliantro y cebolla!</p>
