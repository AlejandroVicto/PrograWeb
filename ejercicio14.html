<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Arreglos</title>
    <link rel="stylesheet" href="css/ejercicio14.css">


    <script src="js/ejercicio14.js"></script>
</head>

<body>
    <div style="margin: 20px; text-align: left;">
        <a href="index.html"
            style="text-decoration: none; color: #007BFF; font-weight: bold; font-family: Arial, sans-serif;">Regresar
            al índice</a>
    </div>
    
    <div class="contenedor-principal">
        <h1>Cálculo de Arreglos</h1>
        <p>Mayor, Menor y Promedio</p>

        <div class="grupo-input">
            <label for="numeros" class="etiqueta">Ingresa números separados por comas:</label>
            <input type="text" id="numeros" class="campo-texto" placeholder="Ej: 10, 20, 30" required>
        </div>
        
        <button type="button" id="btnCalcular">Calcular</button>
        
        <div class="grupo-input">
            <label for="mayor" class="etiqueta">Número mayor:</label>
            <input type="text" id="mayor" class="campo-texto campo-lectura" readonly>
        </div>
        <div class="grupo-input">
            <label for="menor" class="etiqueta">Número menor:</label>
            <input type="text" id="menor" class="campo-texto campo-lectura" readonly>
        </div>
        <div class="grupo-input">
            <label for="promedio" class="etiqueta">Promedio:</label>
            <input type="text" id="promedio" class="campo-texto campo-lectura" readonly>
        </div>
    </div>
</body>

</html>
